name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: A11y test coverage
        run: pnpm check:a11y-coverage

      - name: Unit tests
        run: pnpm test
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:abc
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "0"

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:abc
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "0"

      # Integration tests use the real Firestore emulator. Audit
      # Recommendation #3 (2026-05-12): emulator tests already existed
      # and were honest, but were pre-push-hook-only. PRs from runs
      # that skipped the hook shipped with no integration coverage.
      # firebase-tools (latest) requires JDK 21+; the runner default
      # is older, so we install 21 explicitly.
      - name: Setup Java 21 (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools (for Firestore emulator)
        run: npm install -g firebase-tools@latest

      - name: Integration tests
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:abc
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "1"
